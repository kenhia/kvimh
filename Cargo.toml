[package]
name = "kvimh"
version = "0.1.0"
edition = "2024"
description = "Hearing-assist audio for Windows: frequency lowering, EQ and compression that make speech consonants audible"
license = "MIT"
repository = "https://github.com/kenhia/kvimh"
publish = false

[dependencies]
cpal = "0.18.2"
dirs = "7.0.0"
eframe = "0.37.0"
fastrand = "2.5.0"
hound = "3.5.1"
realfft = "3.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
